name: Build & Release Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Android APK
      run: ./gradlew :app:assembleDebug
      
    - name: Build iOS Framework
      run: ./gradlew :shared:assembleReleaseFramework
      
    - name: Prepare iOS Artifact
      run: |
        cd shared/build/bin/iosArm64/releaseFramework/
        zip -r shared_framework.zip shared.framework
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.15
        name: Version 1.15 (Stable)
        draft: false
        prerelease: false
        make_latest: true
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          shared/build/bin/iosArm64/releaseFramework/shared_framework.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
